[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev-workflow"
version = "0.1.0"
description = "Spec-driven, guardrailed AI development loop using local Ollama models"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "rich>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.pytest.ini_options]
# When running the suite from the repo root, make sure src/ is importable
pythonpath = ["."]

[tool.coverage.run]
source = ["tools"]
